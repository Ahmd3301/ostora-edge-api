<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DowUplBot Player — Series PWA</title>

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
/* ─── DESIGN SYSTEM ─── */
:root {
  --bg: #060809;
  --surface: #0c0f12;
  --panel: #10141a;
  --border: #1a2030;
  --border2: #232d3d;
  --green: #00e87a;
  --yellow: #ffcc00;
  --red: #ff3d3d;
  --blue: #3d9eff;
  --cyan: #00d4ff;
  --dim: #2a3545;
  --text: #bccdd8;
  --text-dim: #4a5e72;
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body { 
  padding: 16px; 
  padding-bottom: env(safe-area-inset-bottom, 24px);
}

/* ─── HEADER ─── */
.header { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  margin-bottom: 20px; 
  gap: 12px; 
  flex-wrap: nowrap; 
  padding-bottom: 16px; 
  border-bottom: 1px solid var(--border); 
}
.header-left {
  display: flex;
  flex-direction: column;
}
.header-left h1 { 
  font-family: 'IBM Plex Mono', monospace; 
  font-size: clamp(0.95rem, 4vw, 1.25rem); 
  color: var(--green); 
  letter-spacing: 0.02em; 
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-left p { 
  font-size: clamp(0.65rem, 2.8vw, 0.8rem); 
  color: var(--text-dim); 
  font-family: 'Tajawal', sans-serif; 
  margin-top: 5px; 
}

/* PWA INSTALL BUTTON */
.btn-install {
  display: none;
  background: linear-gradient(135deg, var(--green), #00b35c);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-family: 'Tajawal', sans-serif;
  font-weight: bold;
  font-size: 0.85rem;
  cursor: pointer;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(0, 232, 122, 0.2);
}
.btn-install:active {
  transform: scale(0.96);
}

/* ─── PANELS & COMPONENTS ─── */
.panel { 
  background: var(--panel); 
  border: 1px solid var(--border); 
  border-radius: 14px; 
  padding: 16px; 
  margin-bottom: 16px; 
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.panel-hd { 
  font-family: 'Tajawal', sans-serif; 
  font-weight: 700;
  font-size: 0.95rem; 
  color: var(--text); 
  margin-bottom: 16px; 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
}
.badge-count {
  background: var(--border);
  color: var(--green);
  font-size: 0.75rem;
  font-family: 'IBM Plex Mono', monospace;
  padding: 2px 8px;
  border-radius: 12px;
}

/* ─── SEARCH BOX ─── */
.search-container { 
  margin-bottom: 16px; 
  position: relative; 
  display: none; /* يتم إظهاره ديناميكياً داخل القوائم */
}
.search-input { 
  width: 100%; 
  padding: 14px 16px 14px 44px; 
  background: var(--surface); 
  border: 1px solid var(--border2); 
  border-radius: 10px; 
  color: var(--text); 
  font-family: 'Tajawal', sans-serif; 
  font-size: 0.95rem; 
  outline: none; 
  transition: all 0.3s ease; 
}
.search-input:focus { 
  border-color: var(--green); 
  box-shadow: 0 0 0 3px rgba(0, 232, 122, 0.15); 
}
.search-input::placeholder { 
  color: var(--text-dim); 
}
.search-icon { 
  position: absolute; 
  left: 14px; 
  top: 50%; 
  transform: translateY(-50%); 
  color: var(--text-dim); 
  pointer-events: none; 
}

/* ─── CATALOG ─── */
.series-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
  gap: 12px; 
}
.series-card { 
  background: var(--surface); 
  border: 1px solid var(--border2); 
  border-radius: 10px; 
  padding: 18px 12px; 
  text-align: center; 
  cursor: pointer; 
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  min-height: 120px; 
  position: relative;
  overflow: hidden;
}
.series-card:active { 
  transform: scale(0.97);
}
@media (hover: hover) {
  .series-card:hover { 
    border-color: var(--green); 
    background: rgba(0,232,122,0.04); 
    transform: translateY(-2px); 
  }
}
.series-card h3 { 
  font-size: 0.95rem; 
  font-weight: 700;
  color: var(--text); 
  margin-bottom: 8px; 
  line-height: 1.4; 
}
.series-card span { 
  font-family: 'IBM Plex Mono', monospace; 
  font-size: 0.7rem; 
  color: var(--text-dim); 
}

/* ─── BACK BUTTON ─── */
.btn-back {
  display: none;
  background: var(--border2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: bold;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.btn-back:active {
  transform: scale(0.95);
}

/* ─── CUSTOM ALERT/DIALOG MODAL ─── */
.custom-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(4, 5, 6, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 20px;
}
.custom-modal.show {
  opacity: 1;
  pointer-events: auto;
}
.modal-content {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  padding: 24px;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.custom-modal.show .modal-content {
  transform: scale(1);
}
.modal-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
}
.modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
}
.modal-text {
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 20px;
}
.modal-btn {
  background: var(--border2);
  color: var(--text);
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-family: 'Tajawal', sans-serif;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
}
.modal-btn:hover {
  background: var(--border);
  color: #fff;
}

/* TOAST NOTIFICATION */
.toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #161c26;
  border: 1px solid var(--border);
  padding: 12px 20px;
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 10000;
  pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast-container.show {
  transform: translateX(-50%) translateY(0);
}
.toast-text {
  font-size: 0.85rem;
  font-weight: bold;
  color: #fff;
  white-space: nowrap;
}

.msg-box { text-align: center; padding: 40px 20px; font-family: 'Tajawal', sans-serif; color: var(--yellow); grid-column: 1 / -1; }
.error-text { color: var(--red); }
</style>
</head>
<body>

<div id="app-root">
  <div class="header">
    <div class="header-left">
      <h1>📺 DowUplBot Player</h1>
      <p id="header-subtitle">تطبيق المسلسلات الذكي والمباشر (PWA)</p>
    </div>
    <button id="btn-pwa-install" class="btn-install">
      <span>تثبيت</span> 📺
    </button>
  </div>

  <div id="view-catalog" class="panel">
    <div class="panel-hd">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button id="btn-back" class="btn-back">⬅️ رجوع</button>
        <span id="panel-title">الأقسام الرئيسية</span>
      </div>
      <span class="badge-count" id="series-counter">0</span>
    </div>
    
    <div class="search-container" id="search-container">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" class="search-input" placeholder="ابحث... (يدعم أ، إ، ا، ي، ئ، ة، ه)">
    </div>
    
    <div id="series-grid" class="series-grid">
      <!-- محتوى ديناميكي -->
    </div>
  </div>
</div>

<!-- مكوّن الإشعارات (Toast) -->
<div id="toast" class="toast-container">
  <span id="toast-icon">✨</span>
  <span id="toast-message" class="toast-text">تم نسخ الرابط بنجاح!</span>
</div>

<!-- مكوّن النافذة المنبثقة (Modal) -->
<div id="modal" class="custom-modal">
  <div class="modal-content">
    <div class="modal-icon" id="modal-icon">⚠️</div>
    <div class="modal-title" id="modal-title">تنبيه</div>
    <div class="modal-text" id="modal-text">لا توجد حلقات متوفرة لهذا العمل في الوقت الحالي.</div>
    <button class="modal-btn" onclick="closeModal()">حسناً</button>
  </div>
</div>

<script>
// إعداد قاعدة البيانات والمسارات ديناميكياً بناءً على النطاق المضيف
const API_BASE_URL = window.location.origin;
let allSeriesData = []; 

// الأقسام الرئيسية في التطبيق
const MAIN_CATEGORIES = [
    { name: "🌙 مسلسلات رمضان", type: "rseries" },
    { name: "📺 مسلسلات عربية", type: "series" },
    { name: "🎬 أفلام عربية", type: "moviesar" },
    { name: "⚽ القنوات الرياضية", type: "sports" }
];

// تصنيفات القنوات الرياضية
const SPORTS_SUBCATEGORIES = [
    { name: "🇪🇬 قنوات رياضية مصرية", id: "200" },
    { name: "⚽ بي إن سبورت FHD", id: "333" },
    { name: "⚽ بي إن سبورت HD", id: "332" },
    { name: "⚽ بي إن سبورت SD", id: "283" },
    { name: "⚽ بي إن سبورت LOW", id: "331" },
    { name: "⚽ بي إن سبورت Premium HD", id: "1070" },
    { name: "⚽ بي إن سبورت Premium SD", id: "1069" },
    { name: "🎙️ قنوات ثمانية", id: "6979" },
    { name: "⭐ StarsPlay الرياضية", id: "3471" },
    { name: "🇦🇪 أبو ظبي الرياضية", id: "467" },
    { name: "💜 شاهد الرياضية", id: "3934" }
];

// حفظ حالة الملاحة الحالية للتنقل الخلفي
let currentState = {
    view: 'categories', // 'categories', 'sports_hub', 'items'
    categoryType: null,
    categoryName: ''
};

// ─── ميزة الـ TOAST و MODAL البديلة للـ ALERT الافتراضية ───
function showToast(message, icon = "⚡") {
    const toast = document.getElementById('toast');
    document.getElementById('toast-message').innerText = message;
    document.getElementById('toast-icon').innerText = icon;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2800);
}

function showModal(title, text, icon = "⚠️") {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-text').innerText = text;
    document.getElementById('modal-icon').innerText = icon;
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

// تطبيع النصوص العربية لتسهيل البحث الدقيق
function normalizeArabic(text) {
    if (!text) return '';
    return text.replace(/[\u064B-\u065F\u0670]/g, '')
               .replace(/[أإآا]/g, 'ا')
               .replace(/[يىئ]/g, 'ي')
               .replace(/[ةه]/g, 'ه');
}

document.getElementById('search-input').addEventListener('input', function(e) {
    const query = normalizeArabic(e.target.value.trim().toLowerCase());
    const filteredData = allSeriesData.filter(series => normalizeArabic(series.name.toLowerCase()).includes(query));
    renderCatalog(filteredData);
});

// الرجوع إلى الصفحة السابقة
document.getElementById('btn-back').addEventListener('click', () => {
    if (currentState.view === 'sports_hub' || currentState.view === 'items') {
        renderMainCategories();
    }
});

// عرض الفئات الرئيسية المتاحة بالتطبيق
function renderMainCategories() {
    currentState = { view: 'categories', categoryType: null, categoryName: 'الأقسام الرئيسية' };
    
    document.getElementById('header-subtitle').innerText = "تطبيق المسلسلات الذكي والمباشر (PWA)";
    document.getElementById('btn-back').style.display = 'none';
    document.getElementById('search-container').style.display = 'none';
    document.getElementById('panel-title').innerText = "الأقسام الرئيسية";
    document.getElementById('series-counter').innerText = MAIN_CATEGORIES.length;

    const grid = document.getElementById('series-grid');
    grid.innerHTML = '';

    MAIN_CATEGORIES.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'series-card';
        card.onclick = () => {
            if (cat.type === 'sports') {
                renderSportsHub();
            } else {
                loadCatalog(cat.type, cat.name);
            }
        };
        card.innerHTML = `<h3>${cat.name}</h3><span>عرض القسم</span>`;
        grid.appendChild(card);
    });
}

// عرض باقات البث المباشر والقنوات الرياضية
function renderSportsHub() {
    currentState = { view: 'sports_hub', categoryType: 'sports', categoryName: 'القنوات الرياضية' };
    
    document.getElementById('btn-back').style.display = 'flex';
    document.getElementById('search-container').style.display = 'none';
    document.getElementById('panel-title').innerText = "باقات البث الرياضي";
    document.getElementById('series-counter').innerText = SPORTS_SUBCATEGORIES.length;

    const grid = document.getElementById('series-grid');
    grid.innerHTML = '';

    SPORTS_SUBCATEGORIES.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'series-card';
        card.style.borderColor = 'var(--blue)';
        card.onclick = () => openItemInExternalApp(sub.id, sub.name, card, true);
        card.innerHTML = `<h3>${sub.name}</h3><span style="color: var(--blue);">قسم مباشر</span>`;
        grid.appendChild(card);
    });
}

// جلب وتحميل قائمة الأعمال لفئة معينة
async function loadCatalog(type, title) {
    currentState = { view: 'items', categoryType: type, categoryName: title };
    
    document.getElementById('btn-back').style.display = 'flex';
    document.getElementById('search-container').style.display = 'block';
    document.getElementById('search-input').value = ''; 
    document.getElementById('panel-title').innerText = title;

    const grid = document.getElementById('series-grid');
    grid.innerHTML = '<div class="msg-box">جاري تحميل القائمة...</div>';
    
    try {
        const res = await fetch(`${API_BASE_URL}/${type}`);
        const data = await res.json();
        if (data.status === 'success' && data.data && Array.isArray(data.data)) {
            allSeriesData = data.data;
            document.getElementById('series-counter').innerText = allSeriesData.length;
            renderCatalog(allSeriesData);
            showToast(`تم تحديث قائمة ${title}`, "✅");
        } else { 
            grid.innerHTML = '<div class="msg-box error-text">فشل في استخراج البيانات من الـ API</div>'; 
        }
    } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="msg-box error-text">تعذر الاتصال بالخادم (تأكد من اتصال الإنترنت)</div>`;
    }
}

function renderCatalog(dataArray) {
    const grid = document.getElementById('series-grid');
    grid.innerHTML = '';
    if (dataArray.length === 0) {
        grid.innerHTML = '<div class="msg-box" style="width:100%">لا توجد نتائج مطابقة لبحثك.</div>';
        return;
    }
    dataArray.forEach(item => {
        const card = document.createElement('div');
        card.className = 'series-card';
        card.onclick = () => openItemInExternalApp(item.id, item.name, card, false);
        card.innerHTML = `<h3>${item.name}</h3><span>ID: ${item.id}</span>`;
        grid.appendChild(card);
    });
}

// ترميز آمن يدعم المحتوى والرموز البرمجية للغة العربية في الـ Base64
function safeB64Encode(str) {
    try {
        const bytes = new TextEncoder().encode(str);
        let binString = "";
        for (let i = 0; i < bytes.length; i++) {
            binString += String.fromCharCode(bytes[i]);
        }
        return btoa(binString);
    } catch (e) {
        return btoa(unescape(encodeURIComponent(str)));
    }
}

// جلب الحلقات وتمريرها للمشغل الخارجي
async function openItemInExternalApp(itemId, itemName, cardElement, isSports = false) {
    const originalContent = cardElement.innerHTML;
    cardElement.style.pointerEvents = 'none';
    cardElement.innerHTML = `<h3>${itemName}</h3><span style="color: var(--yellow);">جاري تحضير البث...</span>`;
    
    // بناء الرابط البرمجي ديناميكياً بناءً على فئة المحتوى
    const fetchUrl = isSports 
        ? `${API_BASE_URL}/sports/${itemId}` 
        : `${API_BASE_URL}/${currentState.categoryType}/${itemId}`;
    
    try {
        const res = await fetch(fetchUrl);
        const data = await res.json();
        
        if (data.status === 'success' && data.episodes && data.episodes.length > 0) {
            // ترتيب الحلقات تصاعدياً رقمياً
            const episodes = data.episodes.sort((a,b) => {
                const numA = parseInt(a.number);
                const numB = parseInt(b.number);
                if (isNaN(numA) || isNaN(numB)) return 0;
                return numA - numB;
            });
            
            // صياغة البيانات
            const payload = episodes.map(ep => ({
                title: ep.title || `الحلقة ${ep.number}`,
                src: ep.url
            }));
            
            const jsonString = JSON.stringify(payload);
            const rawBase64 = safeB64Encode(jsonString);
            const encodedBase64 = encodeURIComponent(rawBase64);
            const intentUri = `videoplyrio://open?data=${encodedBase64}`;
            
            // تشغيل الرابط العميق عبر iframe مخفي
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = intentUri;
            document.body.appendChild(iframe);
            
            showToast("جاري توجيهك للمشغل...", "🎬");

            // إزالة الـ iframe
            setTimeout(() => {
                if (iframe.parentNode) {
                    document.body.removeChild(iframe);
                }
            }, 1000);

        } else {
            showModal('تنبيه', 'لا توجد حلقات متوفرة لهذا العمل حالياً.', '📺');
        }
    } catch (err) {
        console.error(err);
        showModal('خطأ في الاتصال', 'تعذر جلب البيانات، يرجى التحقق من اتصالك بالشبكة.', '❌');
    } finally {
        cardElement.style.pointerEvents = '';
        cardElement.innerHTML = originalContent;
    }
}

// ─── PWA MECHANISM ───

function generatePWAIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#0c0f12';
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, size * 0.22);
    ctx.fill();
    
    ctx.font = `${size * 0.55}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📺', size / 2, size / 2 + size * 0.04);
    
    return canvas.toDataURL('image/png');
}

function setupDynamicPWA() {
    const icon192 = generatePWAIcon(192);
    const icon512 = generatePWAIcon(512);

    const manifestObj = {
        name: "DowUplBot Player PWA",
        short_name: "DowUpl Player",
        description: "واجهة تشغيل المسلسلات المباشرة لـ DowUplBot",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#060809",
        theme_color: "#060809",
        orientation: "any",
        icons: [
            {
                src: icon192,
                sizes: "192x192",
                type: "image/png",
                purpose: "any maskable"
            },
            {
                src: icon512,
                sizes: "512x512",
                type: "image/png",
                purpose: "any maskable"
            }
        ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
        const swScript = `
            const CACHE_NAME = 'dowuplbot-player-v2';
            const ASSETS = [
                '${window.location.href}'
            ];
            self.addEventListener('install', (e) => {
                e.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => {
                        return cache.addAll(ASSETS);
                    }).then(() => self.skipWaiting())
                );
            });
            self.addEventListener('activate', (e) => {
                e.waitUntil(
                    caches.keys().then((keys) => {
                        return Promise.all(
                            keys.map((key) => {
                                if (key !== CACHE_NAME) {
                                    return caches.delete(key);
                                }
                            })
                        );
                    }).then(() => self.clients.claim())
                );
            });
            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    fetch(e.request).catch(() => {
                        return caches.match(e.request);
                    })
                );
            });
        `;
        const swBlob = new Blob([swScript], {type: 'text/javascript'});
        const swURL = URL.createObjectURL(swBlob);

        try {
            navigator.serviceWorker.register(swURL).then(() => {
                console.log('Service Worker Registered Successfully.');
            }).catch(err => {
                console.warn('Service Worker registration rejected:', err);
            });
        } catch (err) {
            console.warn('Service Worker registration not supported in this context:', err);
        }
    }
}

let deferredPrompt;
const btnInstall = document.getElementById('btn-pwa-install');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btnInstall.style.display = 'flex';
});

btnInstall.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            showToast('شكراً لتثبيتك التطبيق!', '🎉');
            btnInstall.style.display = 'none';
        }
        deferredPrompt = null;
    }
});

window.addEventListener('appinstalled', () => {
    showToast('تم تثبيت التطبيق بنجاح!', '📱');
    btnInstall.style.display = 'none';
});

window.onload = () => {
    renderMainCategories();
    setupDynamicPWA();
};
</script>
